name: 사이트 배포

# main 브랜치에 글이 올라오면 자동으로 사이트를 다시 만들어 올립니다.
# 손으로 돌리고 싶으면 GitHub 저장소 > Actions 탭에서 실행할 수 있습니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: 사이트 만들기
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 올리기
        id: deployment
        uses: actions/deploy-pages@v5
